[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-eval-harness"
version = "1.0.0"
description = "Autonomous Multi-Turn Agentic Metamorphic Fuzzer & Swarm Consensus Stress-Testing Engine. Formulates Martingale context drift estimators, metamorphic execution DAGs, and Sybil groupthink inoculation filters."
readme = "README.md"
authors = [{ name = "Ahmed Hassan", email = "founder@a2zsoc.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "agentic-evaluation",
    "llm-benchmarks",
    "multi-agent-systems",
    "metamorphic-testing",
    "context-drift",
    "swarm-intelligence",
    "ai-safety",
    "byzantine-fault-tolerance",
    "red-teaming",
    "automated-testing",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://a2zsoc.com"
Repository = "https://github.com/AAH20/swarm-eval-harness"
